# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx1024m -Dfile.encoding=UTF-8
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true
# AndroidX package structure to make it clearer which packages are bundled with
# the Android operating system, and which are packaged with your app"s APK
# https://developer.android.com/topic/libraries/support-library/androidx-vn
android.useAndroidX=true
# Automatically convert third-party libraries to use AndroidX
android.enableJetifier=true
# Keep R fields final so switch/case on R.id works (AGP 8 compatibility)
android.nonFinalResIds=false

# Keep memory usage modest on the 2 GB build box
org.gradle.workers.max=2
org.gradle.daemon=false

# Force gradle to use our extracted JDK (has javac) for both the daemon
# itself and the java compiler toolchain detection.
org.gradle.java.home=/home/z/jdk21-extracted/usr/lib/jvm/java-21-openjdk-amd64
# Tell gradle where to look for toolchains AND turn off auto-detection of
# system JRE installations (which lack javac and break the build).
org.gradle.java.installations.paths=/home/z/jdk21-extracted/usr/lib/jvm/java-21-openjdk-amd64
org.gradle.java.installations.auto-download=false
org.gradle.java.installations.auto-detect=false
